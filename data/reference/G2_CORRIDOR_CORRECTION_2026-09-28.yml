status: PENDING_REGENERATION
status_meaning: >-
  AGENTS.md requires a conflict between canonical sources to be recorded before data
  changes. DEC-0012 states that a segment holds every official route node between its
  endpoints, but its locked lists appear to omit the six stations below. This file records
  the conflict and a proposed correction; it changes no G2 artifact. The committed G2
  artifacts, G3 Access observations and public corridor payloads keep the old lists.
  The validator enforces the transitions: PENDING_OWNER_DECISION keeps owner_decision
  PENDING; PENDING_REGENERATION needs owner_decision set to a DEC/OWNER entry present in
  decisions/DECISION_REGISTER.md; APPLIED additionally needs a CONFIRMED first-hand
  official check, confirmed exclusion evidence, and regenerated segments that reuse the
  recorded IDs.
detection:
  method: scripts/validate_corridor_completeness.py
  rule: >-
    For each pilot corridor, every N02-25 station record with the corridor operator and
    one of its source routes that lies between two consecutive segment stations
    (detour ratio (|AQ|+|QB|)/|AB| <= detour_ratio_max) must be a segment station, an
    auxiliary context station, a proposed exclusion, or a pending insertion.
  detour_ratio_max: 1.3
  ratio_window_note: >-
    On committed data a single omitted in-scope station gives at most 1.235 (赤坂見附) and
    the nearest unlisted non-service record gives 1.361 (北赤羽). The test suite pins that
    the threshold stays between them.
  independent_records: dist/network.json (N02-25 records selected by the DEC-0018 coordinate polygon)
  under_test: data/derived/stations.parquet (G2 output; supplies segment and auxiliary rows only)
  unscreened_sections:
    pc_odakyu_odawara: [[東海大学前, 小田原]]
    pc_tobu_tojo: [[北坂戸, 寄居]]
    pc_tsukuba_express: [[流山おおたかの森, つくば]]
  unscreened_reason: >-
    These segment edges have an endpoint outside the DEC-0018 browse polygon, so no
    independent N02 record exists for them in the repository. An omission there would not
    be detected. Screening them needs the raw N02 bundle (walk N02 route order under
    verify-locked).
  known_limit: >-
    Several adjacent omissions can raise the chord ratio above the threshold (for example
    a simulated 神田+御茶ノ水 double omission on the Chuo segment), so a multi-station
    omission may be reported only partly or missed.
apply_preconditions:
  - Done 2026-09-28: DEC-0019 amends DEC-0012 and lifts the DEC-0018 freeze for these two corridors.
  - Re-read the operator's current official station list for each corrected corridor and add url and retrieved_at records under official_confirmation.records; set its status to CONFIRMED only if the list matches.
  - Confirm the proposed exclusions the same way and set exclusion_evidence.status to CONFIRMED.
  - Seed data/reference/PHASE1_IDENTITY_REGISTRY.yml maps.station and maps.station_group with the reuse_ids for these N02 keys before running build_phase1_identity.py. It mints from that registry, not from NETWORK_IDENTITY_REGISTRY.json, and would otherwise mint second IDs.
  - Keep every existing station_id, station_group_id and line_id unchanged; only append aliases and crosswalk rows.
  - Regenerate G2 (build_phase1_identity.py), then G3 Access observations and the public corridor payloads, in one pass. Run verify-fast, verify-locked and verify-g3.
