status: PENDING_OWNER_DECISION
status_meaning: >-
  AGENTS.md requires a conflict between canonical sources to be recorded before data
  changes. DEC-0012 states that a segment holds every official route node between its
  endpoints, but its locked lists omit the six stations below. This file records the
  conflict and the proposed correction; it does not change any G2 artifact. The
  committed G2 artifacts, G3 Access observations and public corridor payloads keep the
  old lists. After the Owner accepts a correction in DECISION_REGISTER.md, set
  PENDING_REGENERATION; after one regeneration applies every insertion (locked raw
  bundle, `make verify-locked`, first-hand official confirmation), set APPLIED.
detection:
  method: scripts/validate_corridor_completeness.py
  rule: >-
    For each pilot corridor, every N02-25 station record with the corridor operator and
    one of its source routes that lies between two consecutive segment stations
    (detour ratio (|AQ|+|QB|)/|AB| <= detour_ratio_max) must be a segment station, a
    listed auxiliary context station, an accepted exclusion, or a pending insertion.
  detour_ratio_max: 1.3
  station_pool:
    - data/derived/stations.parquet
    - dist/network.json
  note: >-
    The pool covers every N02-25 record inside the DEC-0018 metro browse scope. It is a
    QA completeness screen over committed derivatives of the locked source, not a
    replacement for walking N02 route topology during regeneration.
apply_preconditions:
  - Re-read the operator's current official station list for each corrected corridor and record the URL and retrieval date under official_confirmation.
  - Reuse the opaque IDs listed under reuse_ids; they were minted once by DEC-0018 in NETWORK_IDENTITY_REGISTRY.json. Do not mint second IDs for the same N02 keys.
  - Keep every existing station_id, station_group_id and line_id unchanged; only append aliases and crosswalk rows.
  - Regenerate G2 (build_phase1_identity.py), then G3 Access observations and the public corridor payloads, in one pass. Run verify-fast, verify-locked and verify-g3.
official_confirmation:
  status: PENDING_FIRST_HAND_CHECK
  existing_evidence_to_recheck:
    - url: https://www.jreast.co.jp/map/pdf/map_tokyo.pdf
      supports: JR East route map listing Keihin-Tohoku/Negishi and Chuo-Sobu local stops.
    - url: https://timetables.jreast.co.jp/2608/train/120/120121.html
      supports: Current Keihin-Tohoku/Negishi station timetable index for 大宮—大船.
  expected_result: >-
    JR East station numbering JK47 大宮 to JK01 大船 gives 47 stations; JB18 御茶ノ水 to
    JB39 千葉 gives 22 stations. These counts come from reviewer knowledge because this
    session could not reach operator sites; the regeneration run must confirm them first-hand.
