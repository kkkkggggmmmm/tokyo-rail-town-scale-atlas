rules_version: "0.1.0"
project_id: tokyo-rail-town-scale-atlas
phase: 1
gate: G2
status: candidate_review
fixed_at: "2026-08-30"
source_release_id: N02-25
source_namespace: N02_2025
notes:
  - >-
    このファイルはN02-25の物理路線・駅地物を、Phase 1の8つの分析回廊へ
    候補として切り出す規則である。canonical IDは別のidentity registryで発行する。
  - >-
    同名300mのN02_005gはstation_groupの候補seedにのみ使う。異名乗換を近接だけで
    hubへ確定しない。
  - >-
    distance_from_origin_kmは駅中心点間の測地線累積値であり、営業キロではない。
    路線形状からの営業距離は後続ゲートで置換または検証する。

