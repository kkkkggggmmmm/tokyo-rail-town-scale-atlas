decision_rule:
  hub: >-
    Confirm only when an operator's current official station or route material identifies
    the railway transfer. Proximity or the N02 same-name/300m seed alone is insufficient.
  rejection: >-
    Keep station groups separate when both operators' current official transfer guidance
    does not identify the other railway; a later center may still link both stations.
  service_segment: >-
    Lock every named station node, in official route order, between the frozen endpoints.
    Train-class, weekday, and time-of-day skip patterns do not delete route nodes.

