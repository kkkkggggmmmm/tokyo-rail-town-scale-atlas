registry_version: "0.1.0"
project_id: tokyo-rail-town-scale-atlas
status: candidate_registry_fixed_for_phase_1_adjudication
fixed_at: "2026-08-30"
case_count: 60
split_policy:
  calibration_count: 45
  holdout_count: 15
  rule: >-
    holdoutはparameter、threshold、cluster命名の調整に使わない。
    Phase 1開始時にregistry hashを固定し、候補境界出力後に評価器だけが参照する。
interpretation:
  note: >-
    これは最終ランキングでも確定類型でもない。中心地のidentity、境界、相対制約、
    誤りやすい構造を人間が監査するための候補registryである。
  boundary_reference_required_in_phase_1: true
  minimum_adjudicators_per_high_priority_case: 2
coverage_targets:
  - major_urban_composite
  - metropolitan_subcenter
  - suburban_regional_center
  - transfer_dominant
  - mall_led
  - office_district
  - food_night
  - tourism_leisure
  - linear_shopping_street
  - small_station_front
  - multi_station_one_center
  - one_station_multi_center

