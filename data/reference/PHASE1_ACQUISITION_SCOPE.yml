scope_version: "0.1.0"
project_id: tokyo-rail-town-scale-atlas
phase: 1
gate: G1
fixed_at: "2026-08-30"
official_recheck:
  checked_at: "2026-08-30"
  correction_log_url: https://nlftp.mlit.go.jp/ksj_error.html
  estat_update_url: https://www.e-stat.go.jp/help/data-definition-information/update-information
  terms_urls:
    - https://nlftp.mlit.go.jp/ksj/other/agreement_01.html
    - https://www.e-stat.go.jp/terms-of-use
analysis_extent:
  display_prefectures:
    - {code: "11", name_ja: 埼玉県}
    - {code: "12", name_ja: 千葉県}
    - {code: "13", name_ja: 東京都}
    - {code: "14", name_ja: 神奈川県}
  default_boundary_buffer_m: 10000
  pilot_tx_exception:
    prefecture: {code: "08", name_ja: 茨城県}
    rule: full_station_sequence_plus_5000m_corridor
    display_in_initial_domain: false
  estat_prefecture_partitions:
    - {code: "08", name_ja: 茨城県, scope_reason: tx_pilot_and_adjacent_buffer}
    - {code: "09", name_ja: 栃木県, scope_reason: adjacent_10km_buffer}
    - {code: "10", name_ja: 群馬県, scope_reason: adjacent_10km_buffer}
    - {code: "11", name_ja: 埼玉県, scope_reason: display_domain}
    - {code: "12", name_ja: 千葉県, scope_reason: display_domain}
    - {code: "13", name_ja: 東京都, scope_reason: display_domain}
    - {code: "14", name_ja: 神奈川県, scope_reason: display_domain}
    - {code: "19", name_ja: 山梨県, scope_reason: adjacent_10km_buffer}
    - {code: "22", name_ja: 静岡県, scope_reason: adjacent_10km_buffer}
  partition_note: >-
    e-Statの公開単位が都道府県zipのため、隣接県は10km edge bufferを完全に覆う
    保守的な取得範囲である。G3で公式mesh geometryにより10km境界へtrimし、
    県全域を表示集計へ混入させない。

