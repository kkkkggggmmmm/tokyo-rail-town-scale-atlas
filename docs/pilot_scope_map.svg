<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">東京圏 駅まちスケール・アトラス 代表8沿線</title>
  <desc id="desc">1都3県の表示範囲、10km解析バッファ、つくばまでのパイロット例外回廊を示す模式図</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10233f" flood-opacity="0.12"/>
    </filter>
    <style>
      .jp { font-family: "DejaVu Sans", Arial, sans-serif; }
      .route { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .halo { fill: none; stroke: #ffffff; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; opacity: .95; }
      .station { fill: #fff; stroke: #162944; stroke-width: 2; }
      .label { font-size: 14px; fill: #20344f; font-weight: 650; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
      .legend { font-size: 14px; fill: #263b55; }
    </style>
  </defs>
  <rect width="1200" height="860" fill="#f4f7fb"/>
