<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1369d6">
<meta name="description" content="東京圏の駅を、地図と公的な数値で探す・比べる。飲食店、買い物、仕事、学生の暮らしを、出典と集計範囲を確かめながら読む駅まちアトラス。">
<title>駅まちアトラス｜地図とデータで街を知る</title><link rel="stylesheet" href="./vendor/maplibre-gl.css"><link rel="stylesheet" href="./style.css">
</head><body>
<a class="skip" href="#content">本文へ</a>
<header class="header"><a class="brand" href="#view=map"><span class="brand-mark" aria-hidden="true">A</span><span>駅まちアトラス<small>東京圏を、地図とデータで。</small></span></a><nav class="main-nav" aria-label="主な画面"><button data-view="map">探す</button><button data-view="profile">駅プロフィール</button><button data-view="compare">比較</button><button data-view="line">沿線で見る</button><button data-view="numbers">地域データ</button></nav><div class="header-actions"><button id="favorites-open" aria-label="保存した駅を見る">♡ <span>保存した駅</span></button><button id="method-open" aria-label="出典と使い方">?</button></div></header>
<main id="content">
<div id="entry-points" class="entry-points" aria-label="調べ方を選ぶ"><button data-entry="station"><span class="entry-icon">⌕</span><span><b>駅・街から探す</b><small>この駅の周りは、どんな街？</small></span><span>→</span></button><button data-entry="line"><span class="entry-icon">≋</span><span><b>沿線から見る</b><small>どんな街が、順に並ぶ？</small></span><span>→</span></button><button data-entry="theme"><span class="entry-icon">▥</span><span><b>特徴から探す</b><small>飲食・買い物・学生の暮らし</small></span><span>→</span></button></div>
<form id="search-form" class="search-bar" role="search"><label class="search-field"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="駅名・街名・路線名で探す" aria-label="駅名・街名・路線名で探す" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-suggestions" autocomplete="off" maxlength="80"></label><button type="submit" class="primary">検索</button><button type="button" id="filter-toggle" aria-expanded="true" aria-controls="filter-panel">絞り込み</button><div id="search-suggestions" class="search-suggestions" role="listbox" aria-label="分類別の検索候補" hidden></div></form>
<div id="theme-surface" class="theme-surface"><div class="theme-heading"><h1>テーマで見る</h1><p>街の中身を、地図と数値で。</p></div><div id="theme-tabs" class="theme-tabs" aria-label="関心のあるテーマ"></div><label class="map-metric-select">地図の指標<select id="metric-select"></select></label></div><div id="filter-anchor"><div id="filter-panel" class="filter-panel" hidden><h2>表示する駅を絞り込む</h2><div class="filter-row"><label>沿線<select id="route-select" aria-label="沿線を選択"></select></label><label>公表データの都県<select id="pref-select"><option value="all">1都3県すべて</option><option value="13">東京都</option><option value="14">神奈川県</option><option value="11">埼玉県</option><option value="12">千葉県</option></select></label><label>並べ替え<select id="sort-select"></select></label><button id="sort-direction" aria-label="並べ替えの向きを切り替え">多い順 ↓</button><label class="check"><input id="available-only" type="checkbox">選択指標の数値あり</label><button id="reset-filters" class="text-button">条件をクリア</button></div><p class="note">都県は公表区画の所属です。境界駅は複数都県に含まれ、未収録駅は対象外になります。</p><div class="filter-actions"><button id="filter-cancel">取り消す</button><button id="filter-apply" class="primary">表示する</button></div></div></div>
<div id="active-filters" class="active-filters"></div><p id="live-status" class="sr-only" aria-live="polite"></p>
<section id="map-view" aria-label="駅を探す"><div class="section-heading"><div><h1 id="results-title">駅を探す</h1><p id="results-note">東京・神奈川・埼玉・千葉、8沿線の公表データ</p></div><div class="view-switch" aria-label="地図とリストの表示"><button data-panel="map" aria-pressed="true">地図</button><button data-panel="list" aria-pressed="false">リスト</button></div></div><div class="explore-grid"><section class="panel result-panel" id="result-panel"><div class="board-heading"><span class="step-number">1</span><div><h2>エリア・駅を選ぶ</h2></div></div><div id="explore-search-slot"></div><div id="suggested-stations" class="suggested-stations"></div><label class="quick-line-label">沿線で絞る<select id="quick-line"></select></label><div class="table-tools"><span id="result-count"></span><div><button id="columns-open">比較表の項目</button><button id="download-csv">CSV ↓</button></div></div><div id="column-options" class="column-options" hidden></div><div id="station-results"></div><div id="pagination" class="pagination"></div><div id="list-preview-slot"></div></section><div id="explore-map-slot" class="map-slot"><div id="map-card" class="map-card"><div class="board-heading map-board-heading"><span class="step-number">2</span><div><h2>地図で見る</h2></div></div><div class="map-topbar"><span id="map-topic">自治体・鉄道・駅</span><button id="fit-map">表示駅の全体へ</button></div><div class="map-layer-controls"><label class="check"><input type="checkbox" id="scope-toggle" checked>選択駅の統計区画</label><button id="scope-explain" class="text-button">範囲の読み方</button></div><div id="map" role="region" aria-label="実際の位置に基づく駅の地図"></div><div class="map-key"><span class="dot"></span> 掲載駅 <span class="gray-line"></span> 鉄道 <span class="boundary-line"></span> 自治体界</div><div id="map-legend" class="map-legend"></div><p id="scope-note" class="scope-note" hidden></p><p id="map-status" role="status">地図を読み込んでいます</p></div></div><aside id="explore-summary-slot" class="panel summary-panel" aria-label="選択駅の概要"><div id="map-selection"></div></aside></div><div id="theme-board"></div></section>
<section id="profile-view" hidden><div id="profile-header"></div><div class="profile-grid"><div id="profile-map-slot" class="map-slot"></div><div id="profile-overview"></div></div><div id="station-panel"></div></section>
<section id="compare-view" hidden><div id="compare"></div></section>
<section id="line-view" hidden><div id="line-header"></div><div class="line-layout"><div id="line-map-slot" class="map-slot"></div><aside id="line-insights" class="panel"></aside></div><div id="line-content"></div></section>
<section id="numbers-view" hidden><div id="numbers"></div></section>
<section id="sources-view" hidden><div class="section-heading"><div><h1>出典と数値の読み方</h1><p>数字の意味・年度・対象範囲を確かめる。</p></div><button id="sources-back">元の画面に戻る</button></div><div id="source-overview"></div><div id="method-content" class="panel method-content"></div></section>
</main><dialog id="filter-modal" aria-label="表示する駅の絞り込み"></dialog><div id="compare-tray" class="compare-tray" hidden></div>
<nav class="mobile-nav" aria-label="モバイルの主な画面"><button data-view="map">⌕<span>探す</span></button><button data-view="compare">▥<span>比較</span></button><button id="mobile-favorites">♡<span>保存</span></button><button data-view="line">≋<span>沿線</span></button><button data-view="numbers">▦<span>地域データ</span></button></nav>
<footer><span>店舗・就業 2021年／人口・在学者・売上 2020年／駅利用 2024年度／鉄道 2025年末</span><button id="footer-method" class="text-button">出典と定義</button></footer>
