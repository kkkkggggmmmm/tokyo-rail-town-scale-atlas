<text x="50" y="1392" font-size="13" fill="#617465" font-weight="400">各指標の取得率90%以上で算定。教育・治安・売上・床面積・駅利用人数は含みません。</text>
<text x="50" y="1418" font-size="13" fill="#617465" font-weight="400">区画・駅の位置、欠損、対象区間に影響される参考比較です。CoreScale・住みやすさ順位ではありません。</text>
