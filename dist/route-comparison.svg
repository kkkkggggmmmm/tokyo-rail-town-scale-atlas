<title id="title">東京圏8沿線・駅所在区画の商業と就業</title><desc id="desc">2021年経済センサス。駅を含む500m区画の都県別公表分の中央値。複数都県の区画と秘匿値を除外。8沿線の3指標を同じ縮尺で比較する。</desc>
<rect width="1200" height="1500" fill="#f4f6ef"/><g font-family="Noto Sans JP, sans-serif">
<text x="50" y="57" font-size="14" fill="#617465" font-weight="400">駅まちアトラス  /  DATA COMPARISON</text>
<text x="50" y="106" font-size="36" fill="#274338" font-weight="700">沿線を、実数で比べる。</text>
<text x="50" y="140" font-size="16" fill="#274338" font-weight="400">駅を含む約500m区画・都県公表分の中央値 ｜ 2021年経済センサス</text>
<text x="50" y="170" font-size="14" fill="#617465" font-weight="400">同じ区画は沿線内で1回。繁華街全体の合計・駅から500m圏の集計ではありません。</text>
