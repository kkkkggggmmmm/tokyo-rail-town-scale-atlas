phase_1_acquisition_gate:
  required_before_transform:
    - Download only from the recorded official host.
    - Record final resolved URL, HTTP metadata, byte size, and sha256.
    - Capture archive member names and source encoding.
    - Reconfirm terms and correction log at retrieval time.
    - Fail on unrecognized missing-value tokens.
    - Keep original archives immutable outside Git; commit only manifests and permitted small fixtures.

phase_1_acquisition:
  status: G1_LOCKED
  scope_manifest: data/reference/PHASE1_ACQUISITION_SCOPE.yml
  source_lock: data/manifests/source_lock.phase1.yml
  official_recheck_manifest: data/manifests/official_recheck.phase1.yml
  raw_root: data/raw/phase1
  raw_archives_in_git: false
  archive_count: 24
  archive_member_count: 91
  archive_bytes: 38883077
  locked_at: "2026-08-30T10:20:22Z"
  source_encoding_note: >-
    e-Stat T001163/T001141 prefectural tables are delivered as CP932 text inside ZIPs;
    N02/S12/L01 retain their official UTF-8/Shift-JIS variants and per-member detection.
  note: >-
    Phase 1 G1で取得した原本はdata/raw/phase1以下に保持し、Gitには取得範囲と
    ハッシュ・アーカイブメンバーを記録したロックファイルだけを登録する。

