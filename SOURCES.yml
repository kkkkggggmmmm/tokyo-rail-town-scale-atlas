  - source_id: ksj_n02_2025
    family: N02
    title_ja: 国土数値情報 鉄道データ 令和7年度
    publisher: 国土交通省
    official_catalog_url: https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-N02-2025.html
    product_spec_url: https://nlftp.mlit.go.jp/ksj/gml/product_spec/KS-PS-N02-v3_1.pdf
    candidate_download_url: https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-25/N02-25_GML.zip
    release_id: N02-25
    artifact_status: not_acquired_phase0
    geographic_coverage: nationwide
    spatial_unit: railway_and_station_line_features
    geometry: line
    crs: JGD2011
    temporal:
      reference_date_or_period: "2025-12-31"
      publication_date_or_period: "2026-04"
      publication_precision: month
      retrieved_at: null
    expected_fields:
      - operator_class
      - operator_name
      - railway_name
      - service_status
      - station_name
      - station_code
      - station_group_code
    identity_use:
      station_code: source_alias_only
      station_group_code: source_alias_seed_only
      caveat: >-
        station_codeは緯度順の採番、station_group_codeは同名かつ300m以内という
        出典固有ルールであるため、いずれも内部canonical IDにはしない。
    grain_and_limitations:
      - 駅も線状地物で、出入口や駅舎点を直接表すものではない。
      - 同名300mルールは異名乗換を結合せず、同名でも実体の異なる駅を誤結合し得る。
      - 路線・駅の改廃や再採番を跨ぐ恒久IDは別途必要。
    missingness:
      source_specific_codes: []
      rule: 欠落属性や未収録地物はsource_absentとし、観測0へ変換しない。
    license:
      resolved: true
      name: Creative Commons Attribution 4.0 International
      url: https://creativecommons.org/licenses/by/4.0/
      terms_url: https://nlftp.mlit.go.jp/ksj/other/agreement_01.html
      attribution_required: true
      modification_notice_required: true
      third_party_rights_caveat: true
    model_role:
      layer: core_reference
      permitted_domains: [rail_network, station_alias_seed, line_geometry]
      core_scale_eligible: false
      rationale: 鉄道正本であり、商業活動量ではない。
    official_recheck:
      checked_at: "2026-08-30"
      evidence_urls:
        - https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-N02-2025.html
        - https://nlftp.mlit.go.jp/ksj_error.html
      result: >-
        現行カタログは2025年度版（2025-12-31時点、2026-04更新）を掲載している。
        現行の国土数値情報修正情報にN02-25の掲載は確認されなかった。
      acquisition_guard: >-
        取得日にも訂正情報を再確認し、最終URL、取得時刻、バイト数、SHA-256を
        source lockへ記録する。掲載後の訂正またはアーカイブ差替えはSTOPして再監査する。
