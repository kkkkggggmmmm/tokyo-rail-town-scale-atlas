manifest_version: "0.2.0"
project_id: tokyo-rail-town-scale-atlas
audited_at: "2026-08-30"
manifest_scope: phase_0_audit_plus_phase_1_g0_g1_source_lock
official_recheck:
  checked_at: "2026-08-30"
  scope: >-
    公式カタログ、訂正情報、e-Stat更新情報、および利用規約の再確認。Phase 0では
    原データのダウンロード、アーカイブ内容、ハッシュの検証を実施せず、Phase 1 G1
    では取得日ページのHTTPメタデータ・ハッシュと原本アーカイブを別ロックに記録する。
  raw_archives_verified: false
  recheck_report: docs/OFFICIAL_CORRECTION_RECHECK_2026-08-30.md
  phase1_page_metadata_manifest: data/manifests/official_recheck.phase1.yml
artifact_policy:
  phase_0_downloads_performed: false
  phase_1_downloads_performed: true
  phase_1_source_lock: data/manifests/source_lock.phase1.yml
  phase_1_official_page_hashes: data/manifests/official_recheck.phase1.yml
  note: >-
    Phase 0は取得可能性と利用条件の監査に限定する。Phase 1で取得した実体には、
    download_url、retrieved_at、byte_size、sha256、archive_member、変換履歴を追記する。
date_contract:
  required_fields:
    - reference_date_or_period
    - publication_date_or_period
    - retrieved_at
    - release_id
  rule: >-
    調査・基準時点、収録対象年度、公表時点、取得時点を別々に保存し、
    複数ソースを一つの「2026年値」へ丸めない。
license_contract:
  unresolved_source_is_stop: true
  third_party_rights_review_required: true
missingness_contract:
  null_is_never_zero: true
  raw_token_must_be_preserved: true
  normalized_statuses:
    - observed
    - observed_zero
    - imputed
    - suppressed
    - aggregation_destination
    - not_public
    - not_surveyed
    - not_applicable
    - source_absent
    - duplicate_on_other_record
    - station_absent
    - outside_scope
    - invalid

